#ذِهْ في .github/workflows/triage-prs.yml
'جاهز للمراجعة''جاهز للمراجعة'
على:
  هدف طلب السحب:
    أنواع: [مفتوح, إعادة فتح, ملصق, محرر, جاهز للمراجعة]

وظائف:
  إغلاق غير صالح:
    إذا: github.event.action == 'مُصنَّف'
    الاستخدامات: سطح المكتب/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-close-invalid.yml@main
    الأذونات:
      محتويات: قراءة
      قضايا: يكتب
      طلبات السحب: يكتب

  إغلاق من الفرع الافتراضي:
    إذا: github.event.action == "مفتوح"
    الاستخدامات: سطح المكتب/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-close-from-default-branch.yml@main
    مع:
      الفرع الافتراضي: "تطوير"
    الأذونات:
      طلبات السحب: يكتب

  التسمية الخارجية-pr:
    إذا: github.event.action == "مفتوح" || github.event.action == 'reopened'
    الاستخدامات: سطح المكتب/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-label-external-pr.yml@main
    الأذونات:
      قضايا: يكتب
      طلبات السحب: يكتب
      مشاريع المستودع: قراءة

  متطلبات العلاقات العامة:
    إذا:
      github.event.action == "مفتوح" || github.event.action == 'reopened' ||
      github.event.action == 'تم التعديل' || github.event.action ==
      'جاهز للمراجعة'
    uses: desktop/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-pr-requirements.yml@main
    with:
      enable_pr_screening: true
    permissions:
      issues: read
      pull-requests: write

  close-no-help-wanted:
    if: github.event.action == 'labeled'
    uses: desktop/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-close-no-help-wanted.yml@main
    permissions:
      pull-requests: write

  ready-for-review:
    if: github.event.action == 'labeled'
    uses: desktop/gh-cli-and-desktop-shared-workflows/.github/workflows/triage-ready-for-review.yml@main
    permissions:
      pull-requests: write
